[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
# Distribution name is "twmarketdata" (PyPI rejected "twmd" as too similar to an
# existing project). The import package stays `twmd` — so: pip install twmarketdata,
# then `import twmd`.
name = "twmarketdata"
version = "0.1.0"
description = "Data-access client for the TW Market Data API. Retrieval only, for research and education."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "TW Market Data" }]
keywords = ["taiwan", "market-data", "dataset", "api-client", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  # Deliberately NOT "Information Analysis": this package retrieves data and
  # does not analyse it. The classifier is part of the shipped positioning.
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Database :: Front-Ends",
  "Typing :: Typed",
]

# Pure-Python wheels only. No compiled extensions, no system libraries.
dependencies = [
  "httpx>=0.27,<1.0",
  "pandas>=1.5",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "respx>=0.21"]

[project.urls]
Homepage = "https://twmarketdata.com"
Documentation = "https://api.twmarketdata.com/openapi.json"

[tool.hatch.build.targets.wheel]
packages = ["src/twmd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real API over the network (deselect with -m 'not live')"]
