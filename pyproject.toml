[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twmarketdata"
version = "0.6.0"
description = "Official Python SDK for TW Market Data (TWMD) — Taiwan market data with point-in-time correctness and surfaced data gaps"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "TW Market Data", email = "support@twmarketdata.com" }]
keywords = ["taiwan", "stock", "market-data", "finance", "point-in-time", "backtesting", "twse", "tpex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = ["requests>=2.31.0"]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
# UI 套件是**可選**的。核心 `import twmd` 只靠 requests —— 一個只想取數的人
# 不該為了別人的彩色表格被迫裝 rich/questionary。沒裝時 CLI 退回純文字,不是壞掉。
cli = ["rich>=13.0", "questionary>=2.0", "textual>=0.60"]
dev = ["pandas>=1.5", "rich>=13.0", "questionary>=2.0", "textual>=0.60", "pytest>=7.4", "mypy>=1.8", "types-requests", "responses>=0.24"]

[project.scripts]
# 薄殼,走既有的 Client / registry —— 見 twmd/_cli.py 的模組說明。
# ⚠️ 刻意**不**把 pandas 拉進主依賴:CLI 走 Client.dataset() 的無-pandas 路徑
# (回純 list of dict,而警告照樣發),所以 `pip install twmarketdata` 之後
# `twmd` 就能用,不會為了一個命令列把安裝體積變成三倍。
twmd = "twmd._cli:main"

[project.urls]
Homepage = "https://twmarketdata.com"
Documentation = "https://twmarketdata.com/en/docs"
# 修正 2026-08-25:原本指向 github.com/twmarketdata/twmd-python-sdk,而那個
# **organisation 和 repo 都不存在**(GitHub API 對兩者皆回 404)。PyPI 專案頁
# 會把它顯示成可點的連結,所以要評估這個 SDK 的人第一個動作就會撞到 404 ——
# 讀起來像是這東西沒人維護。正確位址是下面這個(owner 2026-08-25 轉到的公開 org)。
Source = "https://github.com/TW-Market-Data/twmarketdata"
Issues = "https://github.com/TW-Market-Data/twmarketdata/issues"
Changelog = "https://github.com/TW-Market-Data/twmarketdata/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["twmd", "twmd.compat"]

[tool.setuptools.package-data]
# Per-package: a key only covers its own package, so twmd.compat needs its own
# entry. Without it the wheel omits _finmind_map.json and
# `from twmd.compat import finmind` raises FileNotFoundError on import.
twmd = ["py.typed", "_registry.json", "*.pyi"]
"twmd.compat" = ["*.json"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the live API (free tier, no key required)"]
